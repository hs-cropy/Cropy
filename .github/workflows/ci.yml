name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Detect changed components
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/**'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - '.dockerignore'
              - '.gitattributes'
              - '.gitignore'
            backend:
              - 'backend/**'
              - 'ml/**'
              - '.github/**'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - '.dockerignore'
              - '.gitattributes'
              - '.gitignore'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate package manifests and CI scripts
        run: node ../.github/scripts/package-preflight.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - run: npm run typecheck
      - run: npm run build
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q -rs --junitxml=test-results/pytest.xml
      - name: Run ML tests
        working-directory: ml
        run: python -m pytest tests -q -rs --junitxml=test-results/pytest-ml.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: |
            backend/test-results/
            ml/test-results/
          retention-days: 14
          if-no-files-found: ignore

  ci-required:
    if: always()
    needs: [changes, frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test result validation
        run: node --test .github/scripts/*.test.mjs
      - name: Require successful checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs
