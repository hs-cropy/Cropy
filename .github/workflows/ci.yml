name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'develop 에서 실행할 때 서버 배포를 점검만 하고 교체하지 않는다'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Detect changed components
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/**'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - '.dockerignore'
              - '.gitattributes'
              - '.gitignore'
            backend:
              - 'backend/**'
              - 'ml/**'
              - '.github/**'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - '.dockerignore'
              - '.gitattributes'
              - '.gitignore'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate package manifests and CI scripts
        run: node ../.github/scripts/package-preflight.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - run: npm run typecheck
      - run: npm run build
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q -rs --junitxml=test-results/pytest.xml
      - name: Run ML tests
        working-directory: ml
        run: python -m pytest tests -q -rs --junitxml=test-results/pytest-ml.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: |
            backend/test-results/
            ml/test-results/
            마음ai/test-results/
          retention-days: 14
          if-no-files-found: ignore

  ci-required:
    if: always()
    needs: [changes, frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test result validation
        run: node --test .github/scripts/*.test.mjs
      # 배포 스크립트·설정은 frontend/backend 잡이 건드리지 않고, develop 에 들어가면 바로 서버에서 실행된다
      - name: Validate deploy scripts and compose config
        run: |
          shellcheck deploy/*.sh
          SITE_ADDRESS=ci.example docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Require successful checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs

  # develop 이 CI 를 통과하면 Lightsail 데모 서버에 배포한다 (docs/AWS_LIGHTSAIL_DEPLOY.md 6절)
  deploy:
    needs: ci-required
    # DEPLOY_HOST 변수를 지우면 배포를 건너뛴다 (서버 종료 후 등)
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    # 잠금 대기(최대 20분) + 빌드 + 준비 대기·롤백까지 들어가도록 넉넉히 둔다
    timeout-minutes: 60
    # 배포가 겹치지 않게 하나씩. 진행 중인 배포는 끊지 않는다
    concurrency:
      group: deploy-lightsail
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # 서버를 바꾼 뒤에야 실패하지 않도록 접속·확인에 쓰는 변수를 먼저 본다
      - name: Check deploy variables
        run: |
          for v in DEPLOY_USER SITE_ADDRESS; do
            [ -n "${!v}" ] || { echo "::error::$v 변수가 비어 있다"; exit 1; }
          done
      # 예전 실행을 다시 돌려도 구버전이 배포되지 않게 develop 최신 커밋일 때만 배포한다
      - name: Check latest develop
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::develop 에 더 새 커밋($head)이 있어 이 실행은 배포하지 않는다"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare SSH key
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # 서버의 배포 키는 cropy-deploy-entry 만 실행한다. 묶음은 표준입력으로 보낸다
      - name: Deploy to server
        if: steps.latest.outputs.deploy == 'true'
        run: |
          request="$GITHUB_SHA"
          if [ "$DRY_RUN" = true ]; then request="check:$GITHUB_SHA"; fi
          git archive --format=tar.gz HEAD |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$request"
      - name: Check service is ready
        if: steps.latest.outputs.deploy == 'true' && env.DRY_RUN != 'true'
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "https://$SITE_ADDRESS/api/v1/ready"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
