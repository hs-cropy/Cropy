# CropCare AI - 로컬/단일 호스트 배포
#
#   docker compose up -d --build
#   → http://localhost:3000
#
# 브라우저는 프론트엔드 오리진 하나만 호출한다. /api 와 /uploads 는 Next.js의
# rewrite가 backend 컨테이너로 프록시하므로 백엔드 포트를 외부에 열 필요도,
# CORS를 설정할 필요도 없다.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/cropcare.db
      UPLOAD_DIR: /data/uploads
      # scripts/backup_db.py의 기본 백업 위치. 이미지 안(/app/backups)에 두면 컨테이너를
      # 다시 만들 때 정기 백업과 복원 직전 안전 백업이 함께 사라진다
      BACKUP_ROOT: /backups
      ML_MODEL_PATH: /models/best_model.pth
      OFFLINE_BUNDLE_DIR: /offline-assets
      MAX_UPLOAD_MB: "100"
      MAX_IMAGE_PIXELS: "210000000"
      APP_ENV: production
      ALLOW_MOCK_PREDICTIONS: "false"
      ENABLE_PAIR_MODEL: "false"
      MAX_CONCURRENT_DIAGNOSES: "1"
      # 브라우저가 백엔드를 직접 부르지 않으므로 실제로 쓰이지 않는다.
      # 백엔드를 별도 도메인으로 노출한다면 프론트 도메인으로 바꿀 것.
      CORS_ORIGINS: http://localhost:3000
    volumes:
      # 학습된 체크포인트(best_model.pth, pair_mu.pth)는 저장소에 없다.
      # 운영에서는 파일 누락/손상 시 진단503, /api/v1/ready503.
      - ./ml/checkpoints:/models:ro
      - ./frontend/public/offline-assets:/offline-assets:ro
      # SQLite 파일과 업로드 이미지 — 컨테이너를 다시 만들어도 보존된다
      - cropcare-data:/data
      # 백업 — 데이터와 따로 둬서 백업 볼륨만 서버 밖으로 옮기기 쉽게 한다
      # (docs/operations/BACKUP_RESTORE.md)
      - cropcare-backups:/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 30s
      timeout: 10s
      start_period: 60s   # 첫 기동에 모델 로드 시간이 필요하다
      retries: 3

  frontend:
    # BACKEND_ORIGIN은 environment가 아니라 build.args로 준다.
    # Next.js standalone은 rewrite 목적지를 빌드 시점에 굳혀 넣으므로 런타임
    # 환경변수로는 바꿀 수 없다 (frontend/Dockerfile 주석 참고).
    # 값을 바꾸려면 `docker compose up -d --build` 로 다시 빌드해야 한다.
    build:
      context: ./frontend
      args:
        # 컨테이너 이름으로 백엔드를 찾는다 (compose 내부 DNS)
        BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  cropcare-data:
  cropcare-backups:
