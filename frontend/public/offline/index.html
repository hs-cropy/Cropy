<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF7F0"><title>Cropy · 이 기기에서 진단</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7f0;color:#1c2b22;font:16px/1.6 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:24px}h1{color:#28844b;font-size:28px}h2{font-size:21px}.card{background:white;border:1px solid #e1e6df;border-radius:20px;padding:20px;margin:16px 0}button,.button{display:inline-block;border:0;border-radius:12px;padding:12px 18px;background:#318953;color:white;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}button:disabled{opacity:.4;cursor:default}input,select{font:inherit;max-width:100%}select{padding:8px;border-radius:10px;border:1px solid #ddd}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}img{max-width:100%;border-radius:12px}#preview{max-height:280px}.muted{color:#697469;font-size:14px}.status{border-radius:12px;padding:12px;background:#edf5e9}.danger{background:#fff1d8}.secondary{background:#edf2e9;color:#1c2b22}progress{width:100%}li{margin:6px 0}details{margin-top:12px}#history article{border-top:1px solid #e1e6df;padding:16px 0}#history img{width:90px;height:90px;object-fit:cover}#result h2{margin-top:0}.hidden{display:none}#photos{display:flex;gap:12px}#photos img{max-width:45%;max-height:200px}a{color:#287b47}
</style></head><body><main>
<div class="row"><h1>Cropy</h1><a href="/home">서버 진단으로</a></div>
<p>이 기기에서 사진을 분석하고 기록을 저장해요.</p>
<section class="card"><h2>오프라인 준비</h2><p id="ready" role="status">준비 상태를 확인하고 있어요.</p><progress id="progress" max="100" value="0"></progress>
<div class="row"><button id="prepare">모델 준비·업데이트</button><button id="pause" class="secondary" disabled>받기 중단</button></div>
<p class="muted">처음 준비할 때는 연결이 필요해요. 준비가 끝나면 연결 없이 사용할 수 있어요. 업데이트 실패 시 기존 모델을 유지해요.</p></section>
<section class="card"><h2>사진 진단</h2><label>작물 <select id="crop"><option value="">자동 감지</option><option>고추</option><option>무</option><option>배추</option></select></label>
<p><input id="file" type="file" accept="image/jpeg,image/png" capture="environment" aria-label="진단할 사진"></p><img id="preview" alt="선택한 사진" class="hidden">
<div class="row"><button id="diagnose" disabled>이 기기에서 진단하기</button><button id="speak" class="secondary" disabled>결과 읽기</button></div>
<p id="state" role="status"></p><div id="result"></div>
<div id="refine-area" class="hidden"><p id="guidance"></p><label>추가 사진 <input id="second" type="file" accept="image/jpeg,image/png" capture="environment"></label><button id="refine">두 사진으로 다시 확인</button></div>
</section>
<section class="card"><h2>이 기기의 기록</h2><p class="muted">기기 저장은 서버 백업과 달라요. 서버에 연결되면 선택한 기록을 전송할 수 있어요.</p>
<button id="reload" class="secondary">기록 새로 확인</button><div id="history"></div></section>
<p class="muted">모델 분류는 확진을 뜻하지 않아요. 농약 사용 조건은 오프라인 묶음에 포함하지 않으며 최신 등록정보·제품 라벨을 별도로 확인해야 해요.</p>
</main><script type="module" src="/offline/app.mjs"></script></body></html>
